<div class="max-w-3xl mx-auto space-y-6 animate-fade-in p-6">
  <!-- Header -->
  <div class="flex items-center gap-4 mb-8">
    <a
      routerLink="/housing"
      mat-icon-button
      class="bg-white border border-gray-200 text-gray-500 hover:text-primary hover:border-primary transition-all"
    >
      <mat-icon>arrow_back</mat-icon>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-primary">
        {{ isEditing ? "Editar Unidad" : "Nueva Unidad" }}
      </h1>
      <p class="text-sm text-gray-400">
        Información de la vivienda (Sin datos financieros)
      </p>
    </div>
  </div>

  <!-- Form Card -->
  <div class="card-base bg-white">
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-8"
    >
      <!-- Section: Unit Details -->
      <div
        *ngIf="errorMessage"
        class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative mb-4"
        role="alert"
      >
        <span class="block sm:inline">{{ errorMessage }}</span>
      </div>
      <div>
        <h3
          class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 border-b border-gray-100 pb-2"
        >
          Datos de la Vivienda
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Number Input -->
          <div>
            <label class="label-bold"
              >Unidad / Departamento <span class="text-red-500">*</span></label
            >
            <input
              type="text"
              formControlName="number"
              placeholder="Ej. A-101"
              class="input-primary"
              [class.border-red-500]="
                form.get('number')?.invalid && form.get('number')?.touched
              "
            />
            <span
              *ngIf="
                form.get('number')?.hasError('required') &&
                form.get('number')?.touched
              "
              class="text-xs text-red-500 mt-1 block"
            >
              Requerido
            </span>
          </div>

          <!-- Category Select -->
          <div>
            <label class="label-bold"
              >Categoría <span class="text-red-500">*</span></label
            >
            <ng-select
              formControlName="categoryId"
              [items]="categories"
              bindLabel="name"
              bindValue="_id"
              placeholder="Seleccione Categoría"
              appendTo="body"
              class="custom-ng-select"
            >
            </ng-select>
            <span
              *ngIf="
                form.get('categoryId')?.invalid &&
                form.get('categoryId')?.touched
              "
              class="text-xs text-red-500 mt-1 block"
            >
              Requerido
            </span>
          </div>

          <!-- Status Select -->
          <div>
            <label class="label-bold">Estado</label>
            <ng-select
              formControlName="status"
              [items]="statusOptions"
              bindLabel="label"
              bindValue="value"
              [clearable]="false"
              appendTo="body"
              class="custom-ng-select"
            >
            </ng-select>
          </div>

          <!-- Resident Name -->
          <div>
            <label class="label-bold">Residente / Propietario (Opcional)</label>
            <input
              type="text"
              formControlName="residentName"
              placeholder="Nombre del responsable"
              class="input-primary"
            />
            <span
              *ngIf="
                form.get('residentName')?.invalid &&
                form.get('residentName')?.touched
              "
              class="text-xs text-red-500 mt-1 block"
            >
              Requerido
            </span>
          </div>

          <!-- Phone -->
          <div>
            <label class="label-bold">Teléfono (Opcional)</label>
            <input
              type="text"
              formControlName="phone"
              placeholder="Ej. 0991234567"
              class="input-primary"
            />
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div
        class="flex items-center justify-end gap-3 pt-6 mt-2 border-t border-gray-100"
      >
        <a
          routerLink="/housing"
          class="px-6 py-2.5 text-sm font-medium text-gray-600 hover:text-gray-800 hover:bg-gray-50 rounded-lg transition-colors"
        >
          Cancelar
        </a>
        <button
          type="submit"
          [disabled]="form.invalid || loading"
          class="btn-accent shadow-lg shadow-blue-500/20 disabled:opacity-50 disabled:shadow-none min-w-[140px] flex justify-center"
        >
          @if (loading) {
          <mat-icon class="animate-spin text-sm scale-75 mr-2">sync</mat-icon>
          Guardando... } @else { Guardar }
        </button>
      </div>
    </form>
  </div>
</div>
