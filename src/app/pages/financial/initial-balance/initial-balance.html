<div
  class="max-w-4xl mx-auto p-6 animate-fade-in bg-white rounded-lg shadow-sm border border-gray-100"
>
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Saldos Iniciales</h1>
    <p class="text-gray-500">Gestión de saldos y deudas</p>
  </div>

  <mat-tab-group animationDuration="0ms">
    <mat-tab label="Nuevo Registro">
      <div class="py-6">
        <!-- Messages -->
        <!-- Messages (Removed: Handled by SweetAlert) -->

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Unit Select -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2"
              >Vivienda <span class="text-red-500">*</span></label
            >
            <ng-select
              formControlName="unitId"
              [items]="units"
              bindLabel="number"
              bindValue="_id"
              placeholder="Buscar vivienda..."
              appendTo="body"
              class="custom-ng-select"
            >
              <ng-template ng-option-tmp let-item="item">
                <div class="flex justify-between w-full">
                  <span class="font-medium">{{ item.number }}</span>
                  <span class="text-gray-500 text-xs"
                    >{{ item.residentName }}</span
                  >
                </div>
              </ng-template>
            </ng-select>
            <div
              *ngIf="form.get('unitId')?.touched && form.get('unitId')?.invalid"
              class="text-xs text-red-500 mt-1"
            >
              Campo requerido.
            </div>
          </div>

          <!-- Type Radio -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2"
              >Tipo de Registro <span class="text-red-500">*</span></label
            >
            <div class="flex items-center space-x-6">
              <label
                class="flex items-center space-x-2 cursor-pointer p-3 border rounded-lg hover:bg-gray-50 transition-colors"
                [class.border-red-200]="form.get('type')?.value === 'DEBT'"
                [class.bg-red-50]="form.get('type')?.value === 'DEBT'"
              >
                <input
                  type="radio"
                  value="DEBT"
                  formControlName="type"
                  class="text-red-600 focus:ring-red-500"
                />
                <span class="text-gray-900 font-medium">Deuda Antigua (-)</span>
              </label>
              <label
                class="flex items-center space-x-2 cursor-pointer p-3 border rounded-lg hover:bg-gray-50 transition-colors"
                [class.border-green-200]="form.get('type')?.value === 'CREDIT'"
                [class.bg-green-50]="form.get('type')?.value === 'CREDIT'"
              >
                <input
                  type="radio"
                  value="CREDIT"
                  formControlName="type"
                  class="text-green-600 focus:ring-green-500"
                />
                <span class="text-gray-900 font-medium">Saldo a Favor (+)</span>
              </label>
            </div>
          </div>

          <!-- Amount -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2"
              >Monto ($) <span class="text-red-500">*</span></label
            >
            <input
              type="number"
              formControlName="amount"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none"
              placeholder="0.00"
            />
            <div
              *ngIf="form.get('amount')?.touched && form.get('amount')?.invalid"
              class="text-xs text-red-500 mt-1"
            >
              Monto requerido (mínimo 0.01).
            </div>
          </div>

          <!-- Observation -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2"
              >Observación <span class="text-red-500">*</span></label
            >
            <textarea
              formControlName="observation"
              rows="3"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none"
              placeholder="Ej: Deuda arrastrada periodo 2024"
            ></textarea>
          </div>

          <!-- Submit Button -->
          <div class="pt-4">
            <button
              type="submit"
              [disabled]="form.invalid || loading"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:transform-none disabled:shadow-none"
            >
              {{ loading ? 'Procesando...' : 'Registrar Saldo' }}
            </button>
          </div>
        </form>
      </div>
    </mat-tab>

    <mat-tab label="Historial de Saldos">
      <div class="py-6">
        <app-debt-list></app-debt-list>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
