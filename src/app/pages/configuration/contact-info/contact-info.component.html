<div class="p-6 max-w-2xl mx-auto">
  <div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">
      Información de Contacto
    </h2>
    <p class="text-gray-600 mb-6 text-sm">
      Esta información se mostrará en la página principal para que los
      residentes puedan contactar a la administración.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label
          for="fullName"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Nombre Completo</label
        >
        <input
          type="text"
          id="fullName"
          formControlName="fullName"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          placeholder="Ej: Administración General"
        />
      </div>

      <div class="mb-4">
        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1"
          >Celular / Teléfono</label
        >
        <input
          type="text"
          id="phone"
          formControlName="phone"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          placeholder="Ej: +593 99 999 9999"
        />
      </div>

      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
          >Correo Electrónico</label
        >
        <input
          type="email"
          id="email"
          formControlName="email"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          placeholder="Ej: admin@conjunto.com"
        />
      </div>

      <div class="mb-6">
        <label
          for="additionalData"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Datos Adicionales</label
        >
        <textarea
          id="additionalData"
          formControlName="additionalData"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          placeholder="Horarios de atención, dirección, etc."
        ></textarea>
      </div>

      <div class="flex justify-end">
        <button
          type="submit"
          class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
        >
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
