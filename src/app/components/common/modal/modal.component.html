@if (isOpen) {
<div
  class="fixed inset-0 z-50 flex items-center justify-center overflow-x-hidden overflow-y-auto outline-none focus:outline-none bg-black/50 backdrop-blur-sm animate-fade-in"
>
  <div class="relative w-full max-w-lg mx-auto my-6 z-50">
    <!--content-->
    <div
      class="border-0 rounded-lg shadow-lg relative flex flex-col w-full bg-white outline-none focus:outline-none animate-slide-up"
    >
      <!--header-->
      <div
        class="flex items-start justify-between p-5 border-b border-solid border-gray-200 rounded-t"
      >
        <h3 class="text-2xl font-semibold text-gray-800">
          {{ title }}
        </h3>
        <button
          class="p-1 ml-auto bg-transparent border-0 text-gray-400 float-right text-3xl leading-none font-semibold outline-none focus:outline-none hover:text-gray-600"
          (click)="onClose()"
        >
          <span
            class="bg-transparent h-6 w-6 text-2xl block outline-none focus:outline-none"
          >
            ×
          </span>
        </button>
      </div>
      <!--body-->
      <div class="relative p-6 flex-auto">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
<!--dark overlay-->
<div class="fixed inset-0 z-40 bg-black opacity-25" (click)="onClose()"></div>
}
