<div class="space-y-6 animate-fade-in p-6">
  <div class="flex justify-between items-center bg-white p-4 rounded shadow">
    <h2 class="text-2xl font-bold text-gray-800">Gestión de Viviendas</h2>

    @if (authService.isAuthenticated()) {
    <a mat-raised-button color="primary" routerLink="/housing/create">
      <mat-icon>add</mat-icon>
      Agregar Vivienda
    </a>
    }
  </div>

  <div class="mat-elevation-z8 overflow-auto">
    <table mat-table [dataSource]="housing()" class="w-full">
      <!-- Number Column -->
      <ng-container matColumnDef="number">
        <th mat-header-cell *matHeaderCellDef>Unidad</th>
        <td mat-cell *matCellDef="let element">{{ element.number }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">
          <span
            class="px-2 py-1 rounded text-xs font-medium"
            [ngClass]="{
              'bg-green-100 text-green-800': element.status === 'Occupied',
              'bg-yellow-100 text-yellow-800': element.status === 'Empty'
            }"
          >
            {{ element.status === "Occupied" ? "Ocupado" : "Vacío" }}
          </span>
        </td>
      </ng-container>

      <!-- Balance Column -->
      <ng-container matColumnDef="balance">
        <th mat-header-cell *matHeaderCellDef>Saldo</th>
        <td mat-cell *matCellDef="let element">
          {{ element.balance | currency }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          @if (authService.isAuthenticated()) {
          <a
            mat-icon-button
            color="primary"
            [routerLink]="['/housing/edit', element._id]"
          >
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="delete(element._id)">
            <mat-icon>delete</mat-icon>
          </button>
          }
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="['number', 'status', 'balance', 'actions']"
      ></tr>
      <tr
        mat-row
        *matRowDef="
          let row;
          columns: ['number', 'status', 'balance', 'actions']
        "
      ></tr>
    </table>
  </div>
</div>
