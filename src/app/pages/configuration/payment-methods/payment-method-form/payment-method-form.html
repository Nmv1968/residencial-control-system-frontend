<div class="p-6 max-w-2xl mx-auto">
  <div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">
      {{ isEditMode ? 'Editar' : 'Nueva' }} Forma de Pago
    </h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1"
          >Nombre <span class="text-red-500">*</span></label
        >
        <input
          type="text"
          id="name"
          formControlName="name"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          placeholder="Ej: Efectivo, Transferencia"
        />
        <div
          *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          El nombre es obligatorio.
        </div>
      </div>

      <div class="mb-6 flex items-center">
        <input
          type="checkbox"
          id="isActive"
          formControlName="isActive"
          class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
        />
        <label for="isActive" class="ml-2 block text-sm text-gray-900"
          >Activo</label
        >
      </div>

      <div class="mb-6 flex items-center">
        <input
          type="checkbox"
          id="isBank"
          formControlName="isBank"
          class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
        />
        <label for="isBank" class="ml-2 block text-sm text-gray-900"
          >Banco</label
        >
      </div>

      <div
        *ngIf="form.get('isBank')?.value"
        class="mb-6 p-4 border rounded bg-gray-50 space-y-4"
      >
        <h3 class="font-medium text-gray-700 mb-2">Detalles Bancarios</h3>

        <div>
          <label
            for="bankName"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Nombre del Banco <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            id="bankName"
            formControlName="bankName"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          />
          <div
            *ngIf="form.get('bankName')?.touched && form.get('bankName')?.invalid"
            class="text-red-500 text-sm mt-1"
          >
            Requerido
          </div>
        </div>

        <div>
          <label
            for="accountNumber"
            class="block text-sm font-medium text-gray-700 mb-1"
            >N° de Cuenta <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            id="accountNumber"
            formControlName="accountNumber"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          />
          <div
            *ngIf="form.get('accountNumber')?.touched && form.get('accountNumber')?.invalid"
            class="text-red-500 text-sm mt-1"
          >
            Requerido
          </div>
        </div>

        <div>
          <label
            for="accountHolder"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Titular <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            id="accountHolder"
            formControlName="accountHolder"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          />
          <div
            *ngIf="form.get('accountHolder')?.touched && form.get('accountHolder')?.invalid"
            class="text-red-500 text-sm mt-1"
          >
            Requerido
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Tipo de Cuenta <span class="text-red-500">*</span></label
          >
          <div class="flex space-x-4 mt-1">
            <label class="inline-flex items-center">
              <input
                type="radio"
                formControlName="accountType"
                value="SAVINGS"
                class="text-blue-600 focus:ring-blue-500"
              />
              <span class="ml-2">Ahorros</span>
            </label>
            <label class="inline-flex items-center">
              <input
                type="radio"
                formControlName="accountType"
                value="CURRENT"
                class="text-blue-600 focus:ring-blue-500"
              />
              <span class="ml-2">Corriente</span>
            </label>
          </div>
          <div
            *ngIf="form.get('accountType')?.touched && form.get('accountType')?.invalid"
            class="text-red-500 text-sm mt-1"
          >
            Requerido
          </div>
        </div>

        <div>
          <label
            for="additionalData"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Datos Adicionales</label
          >
          <textarea
            id="additionalData"
            formControlName="additionalData"
            rows="2"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
          ></textarea>
        </div>
      </div>

      <div class="flex justify-end space-x-3">
        <a
          routerLink="/configuration/payment-methods"
          class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50"
          >Cancelar</a
        >
        <button
          type="submit"
          [disabled]="form.invalid"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
