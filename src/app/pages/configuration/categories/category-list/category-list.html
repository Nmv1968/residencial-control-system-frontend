<div class="space-y-6 animate-fade-in pb-8">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-primary">Categorías</h1>
      <p class="text-gray-500 text-sm">
        Administra las categorías del conjunto
      </p>
    </div>
    <a
      routerLink="/configuration/categories/new"
      class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors shadow-lg shadow-blue-900/20 flex items-center gap-2 w-fit"
    >
      <mat-icon>add</mat-icon>
      Nueva Categoría
    </a>
  </div>

  <!-- Table Card -->
  <div class="card-base overflow-hidden p-0">
    <div class="overflow-x-auto">
      @if (isLoading) {
      <app-table-skeleton [rows]="5" [columns]="4"></app-table-skeleton>
      } @else {
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th
              class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider"
            >
              Nombre
            </th>
            <th
              class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider"
            >
              Descripción
            </th>
            <th
              class="px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase tracking-wider"
            >
              Acciones
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr
            *ngFor="let category of categories"
            class="hover:bg-gray-50 transition-colors border-b last:border-0 border-gray-100"
          >
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">
                {{ category.name }}
              </div>
            </td>
            <td class="px-6 py-4">
              <div class="text-sm text-gray-500">
                {{ category.description || '-' }}
              </div>
            </td>
            <td class="px-6 py-4">
              <div class="flex justify-center items-center">
                <button
                  mat-icon-button
                  [matMenuTriggerFor]="menu"
                  class="text-gray-600 hover:bg-gray-100"
                >
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <a
                    mat-menu-item
                    [routerLink]="['/configuration/categories/edit', category._id]"
                  >
                    <mat-icon class="text-blue-600">edit</mat-icon>
                    <span>Editar</span>
                  </a>
                  <button mat-menu-item (click)="deleteCategory(category._id)">
                    <mat-icon class="text-red-600">delete</mat-icon>
                    <span>Eliminar</span>
                  </button>
                </mat-menu>
              </div>
            </td>
          </tr>
          <tr *ngIf="categories.length === 0">
            <td colspan="3" class="px-6 py-8 text-center text-gray-500">
              <div class="flex flex-col items-center gap-2">
                <mat-icon class="text-gray-300 scale-150">category</mat-icon>
                <p>No hay categorías registradas.</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      }
    </div>
  </div>
</div>
