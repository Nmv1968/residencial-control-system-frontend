<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Categorías</h2>
    <a
      routerLink="/configuration/categories/new"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors"
    >
      + Nueva Categoría
    </a>
  </div>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Nombre
          </th>
          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Descripción
          </th>
          <th
            class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Acciones
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let category of categories" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-gray-900">
              {{ category.name }}
            </div>
          </td>
          <td class="px-6 py-4">
            <div class="text-sm text-gray-500">
              {{ category.description || '-' }}
            </div>
          </td>
          <td
            class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium"
          >
            <a
              [routerLink]="['/configuration/categories/edit', category._id]"
              class="text-indigo-600 hover:text-indigo-900 mr-4"
              >Editar</a
            >
            <button
              (click)="deleteCategory(category._id)"
              class="text-red-600 hover:text-red-900"
            >
              Eliminar
            </button>
          </td>
        </tr>
        <tr *ngIf="categories.length === 0">
          <td colspan="3" class="px-6 py-4 text-center text-gray-500">
            No hay categorías registradas.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
