<div class="space-y-6 animate-fade-in">
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold text-gray-800">Directorio de Propietarios</h2>

    @if (authService.isAuthenticated()) {
    <button (click)="openCreateModal()" class="btn-primary">
      + Agregar Propietario
    </button>
    }
  </div>

  <app-table
    [columns]="columns"
    [data]="owners()"
    [isLoading]="isLoading()"
    (edit)="openEditModal($event)"
    (delete)="delete($event)"
  ></app-table>

  <app-modal
    [isOpen]="isModalOpen()"
    [title]="isEditing() ? 'Editar Propietario' : 'Nuevo Propietario'"
    (close)="closeModal()"
  >
    <form [formGroup]="ownerForm" (ngSubmit)="save()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700"
          >Nombre Completo</label
        >
        <input
          type="text"
          formControlName="name"
          class="mt-1 block w-full input-field"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700"
          >Cédula / ID</label
        >
        <input
          type="text"
          formControlName="idNumber"
          class="mt-1 block w-full input-field"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          formControlName="email"
          class="mt-1 block w-full input-field"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Teléfono</label>
        <input
          type="text"
          formControlName="phone"
          class="mt-1 block w-full input-field"
        />
      </div>

      <div class="flex justify-end space-x-3 pt-4">
        <button
          type="button"
          (click)="closeModal()"
          class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="ownerForm.invalid"
          class="btn-primary disabled:opacity-50"
        >
          Guardar
        </button>
      </div>
    </form>
  </app-modal>
</div>
