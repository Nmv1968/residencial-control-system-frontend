<mat-sidenav-container class="h-screen w-full bg-background-light">
  <!-- Sidenav -->
  <mat-sidenav
    #sidenav
    mode="side"
    opened
    class="w-72 border-none bg-primary text-gray-300 shadow-xl"
    fixedInViewport="false"
  >
    <!-- Logo Area -->
    <div class="h-20 flex items-center px-8 border-b border-white/10">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-lg bg-accent flex items-center justify-center shadow-lg shadow-blue-900/50"
        >
          <mat-icon class="text-white scale-125">apartment</mat-icon>
        </div>
        <p class="font-bold text-xl text-primary tracking-wide">
          Conjunto Orbea
        </p>
        <p class="font-bold text-xl text-accent tracking-wide">
          Control Financiero
        </p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="p-4 space-y-2 mt-4">
      <div class="px-4 mb-2">
        <span class="text-xs uppercase font-bold text-gray-500 tracking-wider"
          >Principal</span
        >
      </div>

      <a
        routerLink="/dashboard"
        routerLinkActive="bg-accent text-white shadow-lg shadow-blue-500/20"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 hover:bg-white/5 group"
      >
        <mat-icon class="transition-colors group-hover:text-white"
          >dashboard</mat-icon
        >
        <span class="font-medium">Dashboard</span>
      </a>

      <div class="px-4 mb-2 mt-6">
        <span class="text-xs uppercase font-bold text-gray-500 tracking-wider"
          >Gestión</span
        >
      </div>

      <a
        routerLink="/housing"
        routerLinkActive="bg-accent text-white shadow-lg shadow-blue-500/20"
        class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 hover:bg-white/5 group"
      >
        <mat-icon class="transition-colors group-hover:text-white"
          >home_work</mat-icon
        >
        <span class="font-medium">Viviendas</span>
      </a>

      <a
        routerLink="/movements"
        routerLinkActive="bg-accent text-white shadow-lg shadow-blue-500/20"
        class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 hover:bg-white/5 group"
      >
        <mat-icon class="transition-colors group-hover:text-white"
          >receipt_long</mat-icon
        >
        <span class="font-medium">Transacciones</span>
      </a>

      <!-- 
      <a
        routerLink="/reports"
        routerLinkActive="bg-accent text-white shadow-lg shadow-blue-500/20"
         class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 hover:bg-white/5 group"
      >
        <mat-icon class="transition-colors group-hover:text-white">analytics</mat-icon>
        <span class="font-medium">Reportes</span>
      </a>
      -->
    </nav>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="flex flex-col h-full bg-background-light">
    <!-- Topbar -->
    <header
      class="h-20 bg-white border-b border-border flex items-center justify-between px-8 sticky top-0 z-30"
    >
      <div class="flex items-center gap-4">
        <button
          mat-icon-button
          (click)="sidenav.toggle()"
          class="text-gray-500 hover:bg-gray-100 lg:hidden"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <h2 class="text-xl font-semibold text-primary">
          <!-- Dynamic Title could go here -->
          Panel de Control
        </h2>
      </div>

      <div class="flex items-center gap-6">
        @if (isAuthenticated()) {
        <div class="flex items-center gap-3 pl-6 border-l border-gray-100">
          <div class="text-right hidden sm:block">
            <p class="text-sm font-bold text-primary">Administrador</p>
            <p class="text-xs text-gray-500">admin@orbea.com</p>
          </div>
          <button
            mat-icon-button
            [matMenuTriggerFor]="userMenu"
            class="!w-10 !h-10 rounded-full bg-gray-100 flex items-center justify-center text-primary font-bold"
          >
            A
          </button>
          <mat-menu #userMenu="matMenu">
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Cerrar Sesión</span>
            </button>
          </mat-menu>
        </div>
        } @else {
        <a
          mat-flat-button
          color="primary"
          routerLink="/login"
          class="bg-primary"
        >
          Ingresar
        </a>
        }
      </div>
    </header>

    <!-- Content Wrapper -->
    <main class="flex-1 overflow-y-auto w-full p-8">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
