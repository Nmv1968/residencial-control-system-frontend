<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Formas de Pago</h2>
    <a
      routerLink="/configuration/payment-methods/new"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors"
    >
      + Nueva Forma de Pago
    </a>
  </div>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Nombre
          </th>
          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Estado
          </th>
          <th
            class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Acciones
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let method of paymentMethods" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-gray-900">
              {{ method.name }}
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span
              [class]="method.isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
              class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
            >
              {{ method.isActive ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td
            class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium"
          >
            <a
              [routerLink]="['/configuration/payment-methods/edit', method._id]"
              class="text-indigo-600 hover:text-indigo-900 mr-4"
              >Editar</a
            >
            <button
              (click)="deletePaymentMethod(method._id)"
              class="text-red-600 hover:text-red-900"
            >
              Desactivar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
